name: iOS SDK CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build-and-test:
    # Apphud 4.4.8 uses StoreKit APIs introduced with the iOS 26.4 SDK.
    # macos-15 currently defaults to Xcode 26.2 and cannot compile that
    # dependency even though TrackHub itself still supports iOS 15.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift run encoder-tests
      - name: Compile for iOS Simulator
        run: xcodebuild -scheme TrackHub -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
