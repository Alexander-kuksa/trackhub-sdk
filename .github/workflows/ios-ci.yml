name: iOS SDK CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build-and-test:
    # SDK 3 has no billing-SDK dependency, so the ordinary stable Xcode runner
    # is sufficient while the distributed library still supports iOS 15.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift run encoder-tests
      - name: Active and passive local delivery smoke
        run: node Tests/loopback-smoke.mjs
      - name: Compile for iOS Simulator
        run: xcodebuild -scheme TrackHub -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Compile Google ODM adapter for iOS Simulator
        run: xcodebuild -scheme TrackHubGoogleODM -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
